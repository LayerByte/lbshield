name: Python Lint & Auto-PR

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write
  pull-requests: write

jobs:
  ruff-fix:
    name: runner / ruff-auto-fix
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Linter with Auto-fix
        run: ruff check . --fix

      - name: Create Pull Request if there are fixes
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "style(ruff): auto-fix python linter issues"
          title: "Automated Ruff Code Fixes"
          body: |
            This pull request was created automatically using the Ruff linter (`ruff check . --fix`).
          branch: ruff-automated-fixes
          base: main
          signoff: false
